# Referencia para Azure Container Apps (plan Consumption).
# Mínimo 1 réplica para que Discord no se desconecte. Sin ingress público.
# CPU 0.25 / 0.5 GiB es el tamaño más pequeño del plan. maxReplicas 1 = el gasto
# nunca se multiplica. La suscripción Azure for Students no tiene tarjeta: si el
# crédito se acaba, Azure apaga los recursos en vez de cobrar.

properties:
  configuration:
    ingress: null
    activeRevisionsMode: Single
  template:
    containers:
      - name: sesame
        image: ghcr.io/molxno/sesame-bot:v<número>
        resources:
          cpu: 0.25
          memory: 0.5Gi
        env:
          - name: LOG_LEVEL
            value: INFO
          - name: DISCORD_TOKEN
            secretRef: discord-token
          # Límites de consumo (valores por defecto en bot.py)
          - name: MAX_VOICE_GUILDS
            value: "3"
          - name: MAX_QUEUE
            value: "20"
          - name: MAX_TRACK_SECONDS
            value: "900"
          - name: IDLE_LEAVE_SECONDS
            value: "300"
          - name: MAX_GUILDS
            value: "10"
          # Opcional: solo tus servidores, separados por comas
          # - name: ALLOWED_GUILD_IDS
          #   value: "1528586575003516958"
    scale:
      minReplicas: 1
      maxReplicas: 1
