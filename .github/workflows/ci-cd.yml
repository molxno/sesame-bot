# CI/CD de Sesame (Git Flow)
#   PR -> develop/main : valida la rama (gitflow) y corre los tests
#   push a develop     : tests
#   push a main        : tests -> imagen v1.<número> en GHCR + Release de GitHub -> despliega en Azure
#   La misma versión identifica la Release, el tag de git, la imagen y la revisión de Azure.
name: CI/CD

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gitflow:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validar rama según Git Flow
        env:  # por variables de entorno: el nombre de una rama nunca se ejecuta como código
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          case "$BASE" in
            main)    pattern='^(release|hotfix)/' ;;
            develop) pattern='^(feature|bugfix|release|hotfix|dependabot)/' ;;
            *)       exit 0 ;;
          esac
          if [[ ! "$HEAD" =~ $pattern ]]; then
            echo "::error::'$HEAD' no puede ir a '$BASE'. main acepta release/* y hotfix/*; develop acepta feature/*, bugfix/*, release/* y hotfix/*."
            exit 1
          fi
          echo "OK: $HEAD -> $BASE"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # crear el tag y la Release
      packages: write
    outputs:
      version: v1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          pull: true
          build-args: SESAME_VERSION=v1.${{ github.run_number }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/molxno/sesame-bot:latest
            ghcr.io/molxno/sesame-bot:v1.${{ github.run_number }}
      - name: Publicar Release v1.${{ github.run_number }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v1.${{ github.run_number }}
        run: |
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "Sesame $VERSION" --generate-notes \
            --notes "Imagen: \`ghcr.io/molxno/sesame-bot:$VERSION\` · Revisión de Azure: \`sesame--v1-${{ github.run_number }}-1\`"

  deploy:
    needs: publish
    if: vars.AZURE_CLIENT_ID != ''   # se activa al configurar Azure (scripts/azure-setup-cicd.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-azure
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write   # login a Azure sin contraseñas (OIDC)
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Desplegar ${{ needs.publish.outputs.version }}
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          az extension add --name containerapp --upgrade --yes --only-show-errors
          az containerapp update --resource-group sesame --name sesame \
            --image "ghcr.io/molxno/sesame-bot:$VERSION" \
            --revision-suffix "v1-${{ github.run_number }}-$ATTEMPT" \
            --query "{revision:properties.latestRevisionName, estado:properties.provisioningState}" -o table
