# Construye la imagen Docker del bot y la publica en GitHub Container Registry (gratis).
# Azure Container Apps la descarga desde ghcr.io/molxno/sesame-bot:latest
name: Publicar imagen Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/molxno/sesame-bot:latest
            ghcr.io/molxno/sesame-bot:${{ github.sha }}
