# Tests en cada push y PR. Solo si pasan, y solo en main, se publica la imagen en
# GitHub Container Registry (gratis). Azure la descarga como ghcr.io/molxno/sesame-bot:v<número>.
name: Publicar imagen Docker

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q bot.py sesame
      - run: python -m pytest -q

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          build-args: |
            SESAME_VERSION=v${{ github.run_number }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          # v<número> = número de la ejecución en la pestaña Actions (#7 -> v7).
          # Usa ese tag en Azure: con "latest" Azure puede reutilizar una imagen vieja en caché.
          tags: |
            ghcr.io/molxno/sesame-bot:latest
            ghcr.io/molxno/sesame-bot:v${{ github.run_number }}
            ghcr.io/molxno/sesame-bot:${{ github.sha }}
